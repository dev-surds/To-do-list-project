<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate To-Do List</title>
    <style>
        /* === General Styles === */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: var(--background-color, #f4f4f4);
            color: var(--text-color, #000);
        }

        .container {
            background: var(--container-bg, white);
            padding: 20px;
            width: 350px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }

        input, select, button {
            width: 90%;
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background: #28a745;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }

        /* === Task List Styling === */
        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 10px;
            background: #eee;
            margin-top: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 5px;
            cursor: grab;
        }

        /* === Priority Colors === */
        .high-priority { background: #ff4d4d; color: white; }
        .medium-priority { background: #ffcc00; }
        .low-priority { background: #66cc66; }

        /* === Completed Task === */
        .completed { text-decoration: line-through; color: gray; }

        /* === Dark Mode === */
        .dark-mode {
            --background-color: #222;
            --text-color: white;
            --container-bg: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📝 Ultimate To-Do List</h1>
        <input type="text" id="taskInput" placeholder="Add a task...">
        <input type="date" id="dueDate">
        <select id="priority">
            <option value="High">🔥 High Priority</option>
            <option value="Medium">⚡ Medium Priority</option>
            <option value="Low">✅ Low Priority</option>
        </select>
        <button onclick="addTask()">Add Task</button>
        <button id="voiceButton">🎙 Voice Input</button>
        <input type="text" id="searchBox" placeholder="Search tasks..." onkeyup="searchTasks()">
        <button onclick="toggleTheme()">🎨 Change Theme</button>
        <ul id="taskList"></ul>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", loadTasks);

        const taskInput = document.getElementById("taskInput");
        const taskList = document.getElementById("taskList");
        const dueDate = document.getElementById("dueDate");
        const priority = document.getElementById("priority");
        const searchBox = document.getElementById("searchBox");

        function addTask() {
            const taskText = taskInput.value.trim();
            const taskDueDate = dueDate.value;
            const taskPriority = priority.value;

            if (taskText === "") return;

            const li = document.createElement("li");
            li.classList.add(taskPriority.toLowerCase()+"-priority");
            li.innerHTML = `${taskText} 📅 ${taskDueDate} (${taskPriority}) 
                <button class="remove-btn" onclick="removeTask(this)">❌</button>
                <button onclick="editTask(this)">✏</button>`;

            li.addEventListener("click", () => li.classList.toggle("completed"));
            li.draggable = true;
            li.ondragstart = (e) => e.dataTransfer.setData("text", e.target.innerText);
            li.ondrop = (e) => {
                e.preventDefault();
                e.target.innerText = e.dataTransfer.getData("text");
            };

            taskList.appendChild(li);
            setReminder(taskText, taskDueDate);
            saveTasks();
            taskInput.value = "";
        }

        function removeTask(button) {
            button.parentElement.remove();
            saveTasks();
        }

        function editTask(button) {
            taskInput.value = button.parentElement.innerText.replace("❌", "").replace("✏", "").trim();
            button.parentElement.remove();
        }

        function saveTasks() {
            const tasks = [];
            document.querySelectorAll("#taskList li").forEach(task => {
                tasks.push({
                    text: task.innerText.replace(/❌|✏/g, "").trim(),
                    completed: task.classList.contains("completed")
                });
            });
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        function loadTasks() {
            const savedTasks = JSON.parse(localStorage.getItem("tasks")) || [];
            savedTasks.forEach(task => {
                const li = document.createElement("li");
                li.innerHTML = `${task.text} <button class="remove-btn" onclick="removeTask(this)">❌</button>
                <button onclick="editTask(this)">✏</button>`;
                if (task.completed) li.classList.add("completed");
                li.addEventListener("click", () => li.classList.toggle("completed"));
                li.draggable = true;
                taskList.appendChild(li);
            });
        }

        function searchTasks() {
            let filter = searchBox.value.toLowerCase();
            document.querySelectorAll("#taskList li").forEach(task => {
                task.style.display = task.innerText.toLowerCase().includes(filter) ? "flex" : "none";
            });
        }

        function toggleTheme() {
            document.body.classList.toggle("dark-mode");
        }

        function setReminder(taskText, date) {
    if (!date) {
        console.error("Invalid due date provided.");
        return;
    }

    let currentTime = Date.now();
    let alarmTime = new Date(date).getTime();

    if (!isNaN(alarmTime) && alarmTime > currentTime) {
        setTimeout(() => {
            alert(`Time to complete: ${taskText}`);
        }, alarmTime - currentTime);
    } else {
        console.error("Invalid date format or past due date.");
    }
}
            
    
    </script>

</body>
</html>
